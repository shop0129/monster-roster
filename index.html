<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6943c4"><link rel="manifest" href="manifest.webmanifest"><title>小怪獸放電所｜雲端排班</title><style>
:root{font:15px system-ui,'Noto Sans TC',sans-serif;color:#30294b;background:#f6f4fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}header{background:#fff;border-bottom:1px solid #e9e3f4;padding:15px max(16px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:19px}main{max-width:1120px;margin:22px auto;padding:0 15px}.card{border:1px solid #e8e2f5;background:white;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 28px #31245508}.login{max-width:430px;margin:8vh auto}.logo{font-size:38px}h1{font-size:24px;margin:7px 0}h2{font-size:19px;margin:0 0 15px}.muted,small{font-size:12px;color:#817998}label{display:block;font-weight:650;margin:13px 0 6px}input,select{width:100%;border:1px solid #dcd5ef;border-radius:9px;padding:10px;background:white;color:inherit}.btn{border:0;border-radius:10px;background:#6d44c5;color:white;padding:10px 16px;font-weight:700}.btn.subtle{background:#ece6f8;color:#5d38a5}.btn.danger{background:#fde5e6;color:#ac243c}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayhead{text-align:center;padding:7px 0;color:#7e7393;font-size:13px}.day{min-height:105px;border:1px solid #e9e3f4;border-radius:9px;padding:7px;text-align:left;background:#fff;overflow:hidden}.day:hover{border-color:#9679d4;background:#fcfaff}.day.other{background:#f8f7fa;color:#a7a2b0}.day.today{outline:2px solid #8e6ada}.date{font-weight:800;margin-bottom:6px;font-size:13px}.chip{background:#efe9fb;color:#542f9e;padding:4px 5px;border-radius:6px;font-size:11px;margin:3px 0;white-space:normal;overflow-wrap:anywhere}.notice{padding:12px;border-radius:10px;background:#f0ebfa;margin-bottom:16px;color:#5b4293}.error{background:#ffebeb;color:#a9283b}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.employee{border-bottom:1px solid #eee9f5;padding:11px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 30px);box-shadow:0 25px 75px #150d3244}dialog::backdrop{background:#170e355e}dialog>form{padding:22px}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.links{display:flex;gap:10px;align-items:center}.pill{background:#ede5fc;border-radius:20px;padding:5px 9px;font-size:12px;color:#6542af}.empty{color:#958da5;padding:15px 0} @media(max-width:620px){header strong{font-size:15px}.card{padding:13px}.day{min-height:88px;padding:4px;border-radius:6px}.dayhead{font-size:11px}.date{font-size:12px}.chip{font-size:10px;padding:3px}.toolbar h2{font-size:17px}.links{gap:4px}.btn{padding:9px 10px;font-size:13px}}
</style></head><body>
<header><strong>👾 小怪獸放電所 <span style="color:#9478ce">｜雲端排班</span></strong><div class="links"><span id="who" class="pill hidden"></span><button id="logout" class="btn subtle hidden">登出</button></div></header>
<main><section id="loginView" class="card login"><div class="logo">👾</div><h1>員工排班登入</h1><p class="muted">店長與員工使用各自帳號，資料由雲端同步。</p><form id="loginForm"><label>登入帳號（店長填 Email；員工填員工帳號）</label><input id="email" type="text" autocomplete="username" required placeholder="店長 Email 或員工帳號"><label>密碼</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><p id="loginError" class="muted" role="alert"></p><button class="btn" type="submit" style="width:100%">登入</button></form><p class="muted">第一次使用：指定店長信箱 shop0129@gmail.com 可以在這裡建立登入密碼，並完成驗證信確認。</p><button class="btn subtle" id="registerManager" type="button" style="width:100%">首次註冊店長</button></section>
<section id="appView" class="hidden"><div id="message" class="notice hidden" role="status"></div><section class="card"><div class="toolbar"><div class="row"><button id="prev" class="btn subtle" aria-label="上個月">‹</button><h2 id="monthLabel" style="margin:0;white-space:nowrap"></h2><button id="next" class="btn subtle" aria-label="下個月">›</button><button id="today" class="btn subtle">本月</button></div><button id="addEmployee" class="btn hidden">＋ 新增員工</button></div><p id="hint" class="muted"></p><div class="calendar" id="calendar"></div></section><section class="card hidden" id="employeePanel"><h2>員工管理</h2><div id="employees"></div></section></section></main>
<dialog id="dayDialog"><div style="padding:22px"><h2 id="dayTitle">當日班次</h2><div id="dayShiftList"></div><div class="actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button type="button" class="btn subtle" data-close="dayDialog">關閉</button><button type="button" class="btn" id="newShiftForDay">＋ 新增班次</button></div></div></dialog>
<dialog id="shiftDialog"><form id="shiftForm"><h2 id="shiftTitle">新增班次</h2><label>日期</label><input id="shiftDate" type="date" required><label>員工</label><select id="shiftEmployee" required></select><div class="row"><div><label>上班</label><input id="shiftStart" type="time" required value="12:00"></div><div><label>下班</label><input id="shiftEnd" type="time" required value="17:00"></div></div><label>備註（選填）</label><input id="shiftNote" maxlength="100"><div class="actions"><button type="button" id="deleteShift" class="btn danger hidden">刪除</button><button type="button" class="btn subtle" data-close="shiftDialog">取消</button><button class="btn" type="submit">儲存班次</button></div></form></dialog>
<dialog id="employeeDialog"><form id="employeeForm"><h2>新增員工帳號</h2><label>姓名</label><input id="empName" maxlength="40" required><label>職稱</label><select id="empTitle"><option>工讀生</option><option>正職人員</option><option>副店長</option><option>店長</option></select><label>員工登入帳號（3–24 位英數或底線）</label><input type="text" id="empUsername" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" autocomplete="off" placeholder="例如 staff01" required><label>初始密碼（至少 8 碼）</label><input type="password" id="empPassword" minlength="8" required><p class="muted">員工不需要 Email。請將帳號與初始密碼私下交給員工；此種帳號無法透過個人信箱自行重設密碼。</p><div class="actions"><button type="button" class="btn subtle" data-close="employeeDialog">取消</button><button class="btn" type="submit">建立</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);const settings=window.MONSTER_CONFIG||{};
const configured=Boolean(settings.supabaseUrl&&settings.supabaseAnonKey&&!settings.supabaseUrl.includes('YOUR_'));
let db=null,session=null,profile=null,team=[],shifts=[],month=new Date();month.setDate(1);let editId=null;
const show=(id,on)=>$(id).classList.toggle('hidden',!on);const msg=(str,error=false)=>{const n=$('message');n.textContent=str;show('message',Boolean(str));n.classList.toggle('error',error)};
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isManager=()=>profile?.role==='manager';const staffEmail=x=>x.toLowerCase()+'@staff.example.com';
if(configured){db=window.supabase.createClient(settings.supabaseUrl,settings.supabaseAnonKey,{auth:{autoRefreshToken:true,persistSession:true}});boot()}else {$('loginError').textContent='尚未設定雲端連線。請先依 README 設定 config.js 與 Supabase。'}
async function boot(){const {data}=await db.auth.getSession();session=data.session;await refreshAuth();db.auth.onAuthStateChange(async(_event,newSession)=>{if(session?.access_token===newSession?.access_token)return;session=newSession;await refreshAuth()})}
async function refreshAuth(){show('loginView',!session);show('appView',!!session);show('logout',!!session);if(!session){profile=null;return}try{const r=await db.from('profiles').select('id,name,job_title,role,active').eq('id',session.user.id).single();if(r.error)throw r.error;if(!r.data.active)throw Error('帳號已停用');profile=r.data;$('who').textContent=`${profile.name}・${isManager()?'店長':'員工'}`;show('who',true);show('addEmployee',isManager());show('employeePanel',isManager());$('hint').textContent=isManager()?'點日期格可新增班次，點班次可修改／刪除':'僅顯示你自己的上班日期與時間';await loadData()}catch(e){msg('無法載入使用者資料：'+e.message,true);await db.auth.signOut()}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='登入中…';const{error}=await db.auth.signInWithPassword({email:/^[a-z0-9_]{3,24}$/i.test($('email').value.trim())?staffEmail($('email').value.trim()):$('email').value.trim(),password:$('password').value});$('loginError').textContent=error?error.message:''};
$('registerManager').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!=='shop0129@gmail.com')return $('loginError').textContent='第一次註冊只開放指定店長信箱 shop0129@gmail.com';if(password.length<8)return $('loginError').textContent='請設定至少 8 字元密碼';$('loginError').textContent='送出中…';const{error}=await db.auth.signUp({email,password});$('loginError').textContent=error?error.message:'已提出註冊。請到 Gmail 開啟 Supabase 驗證郵件，驗證後再登入。';};
$('logout').onclick=()=>db.auth.signOut();$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);loadData()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);loadData()};$('today').onclick=()=>{month=new Date();month.setDate(1);loadData()};
async function loadData(){if(!profile)return;try{msg('');const from=localDate(new Date(month.getFullYear(),month.getMonth(),1));const to=localDate(new Date(month.getFullYear(),month.getMonth()+1,1));const calls=[db.from('shifts').select('id,employee_id,shift_date,start_time,end_time,note').gte('shift_date',from).lt('shift_date',to).order('start_time')];if(isManager())calls.push(db.from('profiles').select('id,name,job_title,role,active').order('name'));const results=await Promise.all(calls);for(const r of results)if(r.error)throw r.error;shifts=results[0].data||[];team=isManager()?results[1].data||[]:[profile];renderCalendar();renderTeam()}catch(e){msg('讀取失敗：'+e.message,true)}}
function renderCalendar(){const cal=$('calendar');cal.replaceChildren();$('monthLabel').textContent=`${month.getFullYear()} 年 ${month.getMonth()+1} 月`;for(const day of ['日','一','二','三','四','五','六']){const el=document.createElement('div');el.className='dayhead';el.textContent=day;cal.append(el)}const offset=new Date(month.getFullYear(),month.getMonth(),1).getDay();const days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();const count=Math.ceil((offset+days)/7)*7;for(let i=0;i<count;i++){const date=new Date(month.getFullYear(),month.getMonth(),i-offset+1);const key=localDate(date);const inMonth=date.getMonth()===month.getMonth();const cell=document.createElement('button');cell.type='button';cell.className='day'+(inMonth?'':' other')+(key===localDate(new Date())?' today':'');cell.setAttribute('aria-label',key);let label=document.createElement('div');label.className='date';label.textContent=date.getDate();cell.append(label);if(inMonth){for(const s of shifts.filter(s=>s.shift_date===key)){const chip=document.createElement('div');chip.className='chip';const name=team.find(t=>t.id===s.employee_id)?.name||'員工';chip.textContent=`${isManager()?name+' ':''}${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}`;cell.append(chip)}if(isManager())cell.onclick=()=>openDay(key)}else cell.disabled=true;cal.append(cell)}}
function openDay(date){
  const todayShifts=shifts.filter(s=>s.shift_date===date).sort((a,b)=>a.start_time.localeCompare(b.start_time));
  $('dayTitle').textContent=`${date}｜當日班次`;
  const list=$('dayShiftList');list.replaceChildren();
  if(!todayShifts.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='這一天還沒有排班';list.append(empty)}
  for(const shift of todayShifts){
    const row=document.createElement('div');row.className='employee';
    const detail=document.createElement('div');const employee=team.find(t=>t.id===shift.employee_id);
    const name=document.createElement('strong');name.textContent=employee?.name||'員工';
    const time=document.createElement('div');time.textContent=`${shift.start_time.slice(0,5)}–${shift.end_time.slice(0,5)}${shift.note?'｜'+shift.note:''}`;
    detail.append(name,time);row.append(detail);
    const edit=document.createElement('button');edit.type='button';edit.className='btn subtle';edit.textContent='編輯';
    edit.onclick=()=>{$('dayDialog').close();openShift(shift,date)};row.append(edit);list.append(row);
  }
  $('newShiftForDay').onclick=()=>{$('dayDialog').close();openShift(null,date)};
  $('dayDialog').showModal();
}
function openShift(s,date){editId=s?.id||null;$('shiftTitle').textContent=s?'編輯班次':'新增班次';$('shiftDate').value=s?.shift_date||date;$('shiftEmployee').replaceChildren();for(const t of team.filter(x=>x.active)){const o=new Option(`${t.name}・${t.job_title}`,t.id);$('shiftEmployee').add(o)}if(s)$('shiftEmployee').value=s.employee_id;$('shiftStart').value=s?.start_time.slice(0,5)||'12:00';$('shiftEnd').value=s?.end_time.slice(0,5)||'17:00';$('shiftNote').value=s?.note||'';show('deleteShift',!!s);$('shiftDialog').showModal()}
$('shiftForm').onsubmit=async e=>{e.preventDefault();if(!isManager())return;const start=$('shiftStart').value,end=$('shiftEnd').value;if(end<=start)return msg('下班時間需晚於上班時間（跨午夜班次請拆成兩天）',true);const item={shift_date:$('shiftDate').value,employee_id:$('shiftEmployee').value,start_time:start,end_time:end,note:$('shiftNote').value.trim()};const result=editId?await db.from('shifts').update(item).eq('id',editId):await db.from('shifts').insert(item);if(result.error)return msg('儲存失敗：'+result.error.message,true);$('shiftDialog').close();const d=new Date(item.shift_date+'T12:00:00');month=new Date(d.getFullYear(),d.getMonth(),1);await loadData();openDay(item.shift_date)};
$('deleteShift').onclick=async()=>{if(!editId||!isManager()||!confirm('確定刪除這個班次？'))return;const{error}=await db.from('shifts').delete().eq('id',editId);if(error)return msg(error.message,true);$('shiftDialog').close();loadData()};
function renderTeam(){const root=$('employees');root.replaceChildren();if(!isManager())return;for(const p of team){const row=document.createElement('div');row.className='employee';const info=document.createElement('span');info.textContent=`${p.name} ｜ ${p.job_title}${p.active?'':'（已停用）'}`;row.append(info);if(p.id!==profile.id){const b=document.createElement('button');b.className='btn subtle';b.textContent=p.active?'停用':'啟用';b.onclick=()=>toggleEmployee(p);row.append(b)}root.append(row)}if(!team.length)root.textContent='尚無員工'}
$('addEmployee').onclick=()=>$('employeeDialog').showModal();document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>$(el.dataset.close).close());
async function edge(payload){const {data:{session:current}}=await db.auth.getSession();if(!current)throw Error('請重新登入');const response=await fetch(`${settings.supabaseUrl}/functions/v1/manage-employee`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${current.access_token}`,'apikey':settings.supabaseAnonKey},body:JSON.stringify(payload)});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||`HTTP ${response.status}`);return result}
$('employeeForm').onsubmit=async e=>{e.preventDefault();try{await edge({action:'create',name:$('empName').value.trim(),job_title:$('empTitle').value,username:$('empUsername').value.trim().toLowerCase(),password:$('empPassword').value});$('employeeDialog').close();$('employeeForm').reset();await loadData();msg('員工帳號建立成功')}catch(err){msg('新增失敗：'+err.message,true)}};
async function toggleEmployee(p){if(!confirm(`${p.active?'停用':'啟用'} ${p.name}？`))return;try{await edge({action:'set_active',employee_id:p.id,active:!p.active});await loadData();msg('員工狀態已更新')}catch(e){msg(e.message,true)}}
</script></body></html>
